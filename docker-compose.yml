version: '3.8'

services:
  # Relational Database: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: alfacareers_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfacareers_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfacareers_password}
      POSTGRES_DB: ${POSTGRES_DB:-alfacareers_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfacareers_user} -d ${POSTGRES_DB:-alfacareers_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector DB: ChromaDB
  chromadb:
    image: chromadb/chroma:0.4.24
    container_name: alfacareers_chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  # Local AI Engine: Ollama (Llama 3.1)
  ollama:
    image: ollama/ollama:latest
    container_name: alfacareers_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  chromadb_data:
  ollama_data:
